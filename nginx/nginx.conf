events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 50M;

    # Docker's embedded DNS. Without a resolver nginx looks the upstream up once
    # at startup and caches the address forever, so rebuilding only the backend
    # leaves nginx proxying to a container that no longer exists -> 502 until
    # nginx itself is restarted. `valid=10s` re-checks instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # Passing the host through a variable is what defers resolution to
        # request time; a literal in proxy_pass is resolved once at startup.
        set $backend_host  backend;
        set $frontend_host frontend;

        # API requests go to backend
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://$backend_host:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Handle uploads directory.
        # Declared before `location /` so room images are not swallowed by the
        # SPA catch-all.
        location /uploads/ {
            proxy_pass http://$backend_host:3000/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # All other requests go to frontend
        location / {
            proxy_pass http://$frontend_host:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
